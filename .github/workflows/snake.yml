# =========================================================
# Generates an animated "snake" SVG that eats through your
# GitHub contribution graph. Runs automatically every 12
# hours, and also whenever you push to main.
# =========================================================

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # auto-refresh every 12 hours
  workflow_dispatch: {}       # lets you run it manually from the Actions tab
  push:
    branches:
      - main                  # runs once when this file is pushed

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate the snake SVG(s)
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: somyaaa07
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
